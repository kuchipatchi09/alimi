:root{--bg:#f4f3ed;--white:#fff;--black:#171717;--gray:#71716b;--line:#d8d7d0;--olive:#66734c;--red:#a33a31}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--black);font-family:"Asta Sans",sans-serif;word-break:keep-all}button,input,select{font:inherit}button{cursor:pointer;color:inherit}[hidden]{display:none!important}.top{height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #171717;position:sticky;top:0;z-index:5}.logo{border:0;background:none;padding:0;font-size:23px;font-weight:700;letter-spacing:-1px}.logo b{color:var(--red)}nav{height:100%;display:flex}nav button{min-width:95px;border:0;border-left:1px solid var(--line);background:#fff}nav button:last-child{border-right:1px solid var(--line)}nav button.on{background:#171717;color:#fff}main{width:min(1120px,calc(100% - 40px));margin:auto;padding:55px 0 80px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;padding-bottom:20px;border-bottom:1px solid #171717;margin-bottom:20px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.2px}.head h1{margin:10px 0 0;font-size:clamp(33px,5vw,54px);line-height:1;letter-spacing:-2.4px}.head p{margin:10px 0 0;color:var(--gray);font-size:14px}.total{text-align:right;color:var(--gray);font-size:11px}.total strong{display:block;color:#171717;font-size:30px}.setup{display:grid;grid-template-columns:1.5fr 1fr 1fr 150px;background:#fff;border:1px solid #171717}.field{padding:14px 16px;border-right:1px solid var(--line);min-width:0}.field span{display:block;margin-bottom:7px;color:var(--gray);font-size:10px;font-weight:700;letter-spacing:1px}.weeks{display:flex;flex-wrap:wrap;gap:10px}.weeks label{font-size:12px;white-space:nowrap}.weeks input{accent-color:var(--olive)}select,.search{width:100%;min-height:34px;padding:5px 8px;border:1px solid var(--line);border-radius:0;background:#fff}.start{border:0;background:var(--olive);color:#fff;font-weight:600}.warning{min-height:18px;margin:7px 0;color:var(--red);font-size:12px}.box{min-height:470px;padding:29px;background:#fff;border:1px solid #171717}.meta{display:flex;justify-content:space-between;padding-bottom:13px;border-bottom:1px solid var(--line);color:var(--gray);font-size:12px}.q-label{display:block;margin:34px 0 10px}.question{margin:0 0 28px;font-size:clamp(30px,5vw,51px);line-height:1.22;letter-spacing:-1.6px}.answers{border-top:1px solid #171717}.answer{width:100%;min-height:59px;display:grid;grid-template-columns:48px 1fr 28px;align-items:center;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.answer:hover:not(:disabled){background:#f0efe9}.answer .num{color:var(--gray);text-align:center}.answer.ok{background:#e8ecdf}.answer.no{color:var(--red);background:#f5e7e5}.feedback{margin-top:24px;padding:17px 0;border-top:1px solid #171717;border-bottom:1px solid var(--line)}.feedback p{margin:5px 0;color:var(--gray);font-size:14px;line-height:1.6}.next,.plain{padding:11px 17px;border:1px solid #171717;border-radius:0}.next{float:right;margin-top:20px;background:#171717;color:#fff}.plain{background:#fff}.welcome{min-height:410px;display:grid;place-items:center;text-align:center}.welcome b{display:block;color:var(--olive);font-size:82px;line-height:.7}.welcome h2{margin:25px 0 8px}.welcome p{margin:0;color:var(--gray);line-height:1.7}.score{margin:38px 0 4px;font-size:70px;font-weight:700;letter-spacing:-4px}.score small{font-size:20px;color:var(--gray);letter-spacing:0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.tools{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-bottom:20px}.week-title{display:flex;justify-content:space-between;align-items:end;margin-top:35px;padding-bottom:10px;border-bottom:1px solid #171717}.week-title h2{margin:0;font-size:21px}.week-title span{color:var(--gray);font-size:11px}details{background:#fff;border-bottom:1px solid var(--line)}summary{list-style:none;cursor:pointer}summary::-webkit-details-marker{display:none}.word{min-height:68px;display:grid;grid-template-columns:45px 180px minmax(180px,1fr) minmax(180px,1fr) 24px;align-items:center;gap:14px;padding:0 15px}.word .number{color:var(--gray);font-size:11px}.word strong{font-size:18px}.word p{margin:0;color:var(--gray);font-size:13px}.word .syn{color:var(--olive)}details[open] .plus{transform:rotate(45deg)}.detail{padding:22px 62px 26px 254px;background:#ecebe5}.detail dl{margin:0;display:grid;grid-template-columns:90px 1fr;gap:11px 16px;font-size:13px;line-height:1.65}.detail dt{color:var(--gray)}.detail dd{margin:0}.translation{color:var(--gray)}.note{color:var(--red)}.empty{padding:80px 20px;text-align:center;background:#fff;border:1px solid #171717}.empty b{color:var(--olive);font-size:60px}.empty p{color:var(--gray)}footer{padding:19px 32px;display:flex;justify-content:space-between;background:#fff;border-top:1px solid #171717;color:var(--gray);font-size:11px}@media(max-width:760px){.top{height:auto;padding:14px 18px 0;flex-wrap:wrap}nav{width:calc(100% + 36px);height:47px;margin-left:-18px;border-top:1px solid var(--line)}nav button{flex:1;min-width:0}main{width:calc(100% - 28px);padding-top:35px}.setup{grid-template-columns:1fr}.field{border-right:0;border-bottom:1px solid var(--line)}.start{min-height:54px}.box{padding:21px 17px}.tools{grid-template-columns:1fr}.word{min-height:90px;grid-template-columns:28px 100px 1fr 18px;grid-template-areas:"n w m p" ". . s .";gap:5px 8px;padding:12px 9px}.word .number{grid-area:n}.word strong{grid-area:w;font-size:15px}.word .meaning{grid-area:m}.word .syn{grid-area:s;font-size:11px}.word .plus{grid-area:p}.detail{padding:20px}.detail dl{grid-template-columns:65px 1fr}.head{align-items:start}footer{padding:18px;flex-direction:column;gap:8px}}
</style>

<script>
const RAW=[[0,"acquire","습득하다, 얻다","obtain, learn","acquisition (명) 습득; acquired (형) 획득한, 후천적인","Once one has acquired the habit, smoking is very difficult to give up.","일단 습관이 되면 담배를 끊기가 매우 어렵다.",""],[0,"secure","안전한, 안심하는; 확보하다","safe, obtain","security (명) 안전, 보안; securely (부) 안전하게","For many people, home is a place where they feel secure.","많은 사람에게 집은 안심할 수 있는 장소이다.",""],[0,"retain","보유하다, 유지하다; 기억하다","keep, preserve","retention (명) 보유, 기억; retentive (형) 기억력이 좋은","You should retain the receipt in the event you want to exchange your purchase.","구매한 물건을 교환하고 싶을 경우에 대비해 영수증을 보관해야 한다.",""],[0,"peculiar","특이한, 이상한; 몸이 불편한","strange, unusual","peculiarity (명) 특이함; peculiarly (부) 특이하게","The kiwi is a peculiar flightless creature with furry feathers and a long, curved beak.|||I felt a little bit peculiar and lay down.","키위는 털 같은 깃털과 길고 휘어진 부리를 지닌 특이한, 날지 못하는 동물이다.|||나는 몸이 조금 이상해서 누웠다.","첫 예문은 원본의 누락된 연결어를 보완했다. feel peculiar는 몸이 불편하다는 뜻이다."],[0,"prohibit","금지하다","forbid, ban","prohibition (명) 금지; prohibitive (형) 금지하는, 엄두 못 낼 정도로 비싼","Smoking is prohibited in the library.","도서관에서는 흡연이 금지되어 있다.",""],[0,"afford","~할 여유가 있다; 제공하다","provide, supply (제공하다의 의미)","affordable (형) 감당할 수 있는; affordability (명) 가격 부담 가능성","He's an asset that we cannot afford to lose.","그는 우리가 잃어서는 안 되는 소중한 인재이다.","cannot afford to: ~할 여유가 없다, ~해서는 안 된다."],[0,"contract","수축하다; 계약; 병에 걸리다","shrink; agreement; catch","contraction (명) 수축; contractual (형) 계약상의","If wool is submerged in hot water, it tends to contract.|||The merchant was sued for breach of contract.|||At that time she didn't know the fact that she had contracted an incurable disease.","양모를 뜨거운 물에 담그면 수축하는 경향이 있다.|||그 상인은 계약 위반으로 고소당했다.|||당시 그녀는 불치병에 걸렸다는 사실을 몰랐다.","명사 contract는 계약, 동사 contract는 수축하다 또는 병에 걸리다로 사용된다."],[0,"compensate","보상하다, 보충하다","reimburse, make up for","compensation (명) 보상; compensatory (형) 보상하는","The bank acknowledged its error but refused to compensate the customer for his loss.","은행은 잘못을 인정했지만 고객의 손실을 보상하는 것은 거부했다.","compensate A for B: A에게 B를 보상하다."],[0,"illegible","글씨를 읽기 어려운","unreadable, indecipherable","legible (형) 읽을 수 있는; illegibility (명) 판독 불가능함","The ink has faded with time and so parts of the letter were illegible.","시간이 지나 잉크가 바래서 편지 일부를 읽을 수 없었다.","illiterate(문맹의)와 구별한다."],[1,"trigger","유발하다, 촉발하다; 방아쇠","cause, set off","triggered (형/분사) 촉발된; triggering (명/분사) 촉발(하는)","The oversupply can trigger a significant plunge in the domestic rice price.","과잉 공급은 국내 쌀 가격의 큰 폭 하락을 유발할 수 있다.",""],[1,"alert","경계하는, 주의 깊은; 알리다","watchful, vigilant","alertness (명) 경계심; alertly (부) 주의 깊게","Through the night they were alert for any change in his condition.","밤새 그들은 그의 상태에 어떤 변화가 있는지 주의 깊게 살폈다.",""],[1,"subsequent","그다음의, 후속의","following, later","subsequently (부) 그 후에; subsequence (명) 뒤따름, 후속","We made plans for a visit, but subsequent difficulties with the car prevented it.","우리는 방문 계획을 세웠지만 그 후 자동차에 문제가 생겨 방문하지 못했다.",""],[1,"evade","피하다, 회피하다","avoid, dodge","evasion (명) 회피; evasive (형) 회피하는","The minister evaded answering the reporter's question by changing the subject.","장관은 화제를 바꿔 기자의 질문에 답하는 것을 회피했다.","evade + 동명사."],[1,"postpone","연기하다, 미루다","delay, put off","postponement (명) 연기; postponed (분사) 연기된","Owing to the prevalence of H1N1, the new flu virus, the meeting was postponed.","신종 독감 바이러스인 H1N1의 유행 때문에 회의가 연기되었다.",""],[1,"presume","추정하다, ~라고 여기다","suppose, assume","presumption (명) 추정; presumably (부) 아마도","The philosophy of the U.S. justice system is that everyone is presumed innocent until proven guilty.","미국 사법 제도의 원칙은 유죄가 입증될 때까지 모든 사람을 무죄로 추정한다는 것이다.",""],[1,"imperative","필수적인; 반드시 해야 하는 일","essential, crucial","imperatively (부) 반드시, 명령조로; imperativeness (명) 긴급성, 필수성","Physical activity is imperative to all children.|||It is a moral imperative that concessions should be made.","신체 활동은 모든 아이에게 필수적이다.|||양보를 해야 하는 것은 도덕적으로 반드시 지켜야 할 의무이다.","형용사뿐 아니라 명사로도 쓰인다."],[1,"overwhelming","압도적인, 감당하기 힘든","overpowering, immense","overwhelm (동) 압도하다; overwhelmingly (부) 압도적으로","The pressure, speed, and noise of contemporary life can be overwhelming. To regain balance, people must take vacations to rest and relax.","현대 생활의 압박, 속도, 소음은 감당하기 힘들 수 있다. 균형을 되찾으려면 사람들은 휴가를 내어 쉬고 긴장을 풀어야 한다.",""],[1,"hazardous","위험한, 유해한","dangerous, risky","hazard (명/동) 위험 / 위험을 무릅쓰다; hazardously (부) 위험하게","Maybe that substance is hazardous. Let me check the label on the bottle first.","아마 그 물질은 위험할 것이다. 먼저 병에 붙은 라벨을 확인해 보겠다.",""],[2,"acute","극심한; 예리한, 날카로운","severe, intense; perceptive","acutely (부) 극심하게, 예리하게; acuteness (명) 예리함, 극심함","Both of these conditions can result in acute back pain.|||His movies are an acute reflection of reality.","이 두 가지 상태 모두 극심한 허리 통증을 초래할 수 있다.|||그의 영화는 현실을 예리하게 반영한다.","통증에서는 극심한, 관찰·분석에서는 예리한. 의학에서는 급성의라는 뜻도 있다."],[2,"favorable","유리한, 호의적인, 긍정적인","advantageous, beneficial","favor (명) 호의; favorably (부) 호의적으로","Such activities would be favorable to our interest.|||Overall, do you have a favorable or an unfavorable impression of the candidate?","그러한 활동은 우리의 이익에 유리할 것이다.|||전반적으로 그 후보에 대해 긍정적인 인상을 갖고 있는가, 부정적인 인상을 갖고 있는가?",""],[2,"adverse","불리한, 부정적인, 반대의","unfavorable, disadvantageous","adversely (부) 불리하게; adversity (명) 역경","High oil prices are having an adverse effect on the economy.","높은 유가는 경제에 부정적인 영향을 미치고 있다.","adversary는 적·상대라는 관련 단어이다. adversity(역경)와 구별한다."],[2,"humiliate","굴욕감을 주다","embarrass, mortify","humiliation (명) 굴욕; humiliating (형) 굴욕적인","A teacher should not humiliate students who are not bright.","교사는 똑똑하지 않은 학생에게 굴욕감을 주어서는 안 된다.",""],[2,"stigma","오명, 낙인","shame, disgrace","stigmatize (동) 낙인을 찍다; stigmatization (명) 낙인찍기","The stigma of loser followed him wherever he went.","패배자라는 오명이 그가 어디를 가든 따라다녔다.",""],[2,"deplete","고갈시키다, 소모하다","exhaust, drain","depletion (명) 고갈; depletable (형) 고갈될 수 있는","Once the water was depleted, the explorers had to give up hope.","물이 고갈되자 탐험가들은 희망을 포기해야 했다.",""],[2,"prevail","널리 퍼져 있다, 만연하다; 우세하다","predominate, persist","prevalent (형) 널리 퍼진; prevalence (명) 만연, 유행","These superstitions still prevail among certain social groups.","이러한 미신은 특정 사회 집단 사이에 여전히 만연해 있다.",""],[2,"profitable","수익성이 높은, 이익이 되는","lucrative, gainful","profit (명/동) 이익 / 이익을 얻다; profitably (부) 수익성 있게","Over the years it has developed into a highly profitable business.","여러 해에 걸쳐 그것은 수익성이 매우 높은 사업으로 성장했다.",""],[2,"stingy","인색한","mean, miserly","stingily (부) 인색하게; stinginess (명) 인색함","Don't be so stingy.","그렇게 인색하게 굴지 마.",""],[3,"illiterate","문맹의, 읽고 쓸 줄 모르는","uneducated, ignorant (문맥에 따라)","literate (형) 읽고 쓸 줄 아는; illiteracy (명) 문맹","King Sejong recognized that more than four thousand Chinese characters discouraged the illiterate.","세종대왕은 4천 자가 넘는 한자가 문맹인 사람들의 의욕을 꺾는다는 것을 인식했다.","the illiterate: 읽고 쓸 줄 모르는 사람들. illegible(판독하기 어려운)과 구별한다."],[3,"compound","복합의; 악화시키다; 화합물","complex, composite; aggravate","compounded (분사) 악화된, 합성된; compounding (명/분사) 합성, 악화(시키는)","A compound sentence contains two or more clauses.|||Unpaid tax bills compounded the company's financial problems of overspending and declining sales.","중문은 둘 이상의 절을 포함한다.|||미납 세금은 과도한 지출과 매출 감소로 생긴 회사의 재정 문제를 악화시켰다.","compound sentence는 중문(등위절이 연결된 문장), complex sentence는 복문이다."],[3,"reciprocal","상호 간의, 서로 주고받는","mutual, complementary (문맥에 따라)","reciprocally (부) 상호적으로; reciprocate (동) 보답하다, 화답하다","At this late date one need not argue the close interrelation and reciprocal effects of physical processes on mental ones, or vice versa.","이제 와서 신체적 과정과 정신적 과정의 밀접한 상관관계와 상호 영향을 논할 필요는 없다.","mutual과 뜻이 겹치므로 서로 오답 선지로 출제하지 않는다."],[3,"mutual","상호 간의, 공동의","reciprocal, shared","mutually (부) 서로, 상호 간에; mutuality (명) 상호성","The agreement was terminated by mutual consent.","그 계약은 상호 합의로 종료되었다.","by mutual consent: 상호 합의에 따라."],[3,"punctual","시간을 엄수하는, 늦지 않는","timely, prompt","punctually (부) 제시간에; punctuality (명) 시간 엄수","He was trying to impress on his children the importance of being punctual.","그는 자녀들에게 시간을 엄수하는 것의 중요성을 강조하려고 노력하고 있었다.","impress A on B: B에게 A를 깊이 인식시키다."],[3,"applaud","박수를 보내다, 칭찬하다","clap, cheer","applause (명) 박수; applauded (분사) 박수받은, 찬사를 받은","The ideal listener has been humorously described as a person who applauds vigorously.","이상적인 청중은 열렬히 박수를 치는 사람이라고 익살스럽게 묘사되어 왔다.",""],[3,"cover","다루다; 덮다, 보장하다; 덮개","report, protect, conceal","coverage (명) 보도, 보장 범위; cover-up (명) 은폐","The report covered the story in detail.|||The government is expanding insurance coverage for migrant workers.|||The FBI began a criminal investigation into the possibility of a cover-up.","그 보도는 그 사건을 자세히 다뤘다.|||정부는 이주 노동자를 위한 보험 보장 범위를 확대하고 있다.|||FBI는 은폐 가능성에 대한 범죄 수사를 시작했다.","원본 두 번째 예문의 coverage와 세 번째 예문의 cover-up도 함께 학습한다."],[3,"refrain","삼가다, 자제하다","abstain, desist","refrained (분사) 삼간; refraining (분사) 삼가는","My father smokes too much, so he has to refrain.","아버지는 담배를 너무 많이 피우므로 흡연을 자제해야 한다.","refrain from + 명사/동명사. 명사 refrain은 후렴이라는 별도 뜻이다."],[3,"impact","영향, 충격; 영향을 미치다","effect, influence","impacted (분사) 영향을 받은; impactful (형) 영향력이 큰","Changes in technology in the mid-1800s had an enormous impact on the printing industry.","1800년대 중반의 기술 변화는 인쇄 산업에 엄청난 영향을 미쳤다.","have an impact on: ~에 영향을 미치다."]];
const WORDS=RAW.map((x,id)=>({id,week:x[0],word:x[1],meaning:x[2],synonyms:x[3],forms:x[4],examples:x[5].split("|||"),translations:x[6].split("|||"),note:x[7]}));
const WEEK=["8월 4주차","9월 1주차","9월 2주차","9월 3주차"],KEY="asterisk-vocab-cnsh-v1",$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
let saved={wrong:[]},session=null;try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.wrong))saved=x}catch{}
function save(){localStorage.setItem(KEY,JSON.stringify(saved));$("#badge").textContent=saved.wrong.length}
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pageInfo={quiz:["* VOCABULARY QUIZ","어휘 퀴즈","단어와 뜻을 번갈아 확인해 보세요."],data:["* VOCABULARY NOTE","어휘 자료","뜻·유의어·예문·단어 형태를 주차별로 정리했습니다."],wrong:["* REVIEW","오답 노트","틀린 단어만 다시 확인하고 풀어보세요."]};
function go(name){document.querySelectorAll("[data-go]").forEach(b=>b.classList.toggle("on",b.dataset.go===name));["quiz","data","wrong"].forEach(x=>$("#"+x+"-page").hidden=x!==name);[$("#eyebrow").textContent,$("#title").textContent,$("#description").textContent]=pageInfo[name];if(name==="data")renderData();if(name==="wrong")renderWrong()}
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("#weeks").innerHTML=WEEK.map((w,i)=>`<label><input type="checkbox" value="${i}" checked> ${w}</label>`).join("");$("#week-filter").innerHTML='<option value="all">전체 주차</option>'+WEEK.map((w,i)=>`<option value="${i}">${w}</option>`).join("");
function choices(w,type){const key=type==="en"?"meaning":"word",out=[w],used=new Set([w[key]]);for(const x of shuffle(WORDS)){const pair=[w.word,x.word].sort().join("/")==="mutual/reciprocal";if(x.id!==w.id&&!pair&&!used.has(x[key])){out.push(x);used.add(x[key])}if(out.length===4)break}return shuffle(out)}
function startQuiz(custom=null){const weeks=[...document.querySelectorAll("#weeks input:checked")].map(x=>+x.value);let pool=custom||WORDS.filter(x=>weeks.includes(x.week));if(!pool.length){$("#warning").textContent="학습할 주차를 하나 이상 선택하세요.";return}$("#warning").textContent="";const n=$("#count").value==="all"?pool.length:+$("#count").value,mode=$("#mode").value;session={index:0,questions:shuffle(pool).slice(0,Math.min(n,pool.length)).map(word=>{const type=mode==="mix"?(Math.random()<.5?"en":"ko"):mode;return{word,type,options:choices(word,type),answer:null}})};go("quiz");renderQuestion()}
$("#start").onclick=()=>startQuiz();
function renderQuestion(){const q=session.questions[session.index],done=q.answer!==null,key=q.type==="en"?"meaning":"word";$("#box").innerHTML=`<div class="meta"><span>${WEEK[q.word.week]} · ${q.type==="en"?"단어 → 뜻":"뜻 → 단어"}</span><span>${session.index+1} / ${session.questions.length}</span></div><span class="eyebrow q-label">* SELECT ONE ANSWER</span><h2 class="question">${esc(q.type==="en"?q.word.word:q.word.meaning)}</h2><div class="answers">${q.options.map((x,i)=>{const state=done?(x.id===q.word.id?"ok":x.id===q.answer?"no":""):"";return`<button class="answer ${state}" data-answer="${x.id}" ${done?"disabled":""}><span class="num">0${i+1}</span><span>${esc(x[key])}</span><span>${state==="ok"?"✓":state==="no"?"×":""}</span></button>`}).join("")}</div>${done?`<div class="feedback"><strong>${q.answer===q.word.id?"정답입니다.":`정답: ${esc(q.word.word)} · ${esc(q.word.meaning)}`}</strong><p>${esc(q.word.examples[0])}</p><p>${esc(q.word.translations[0])}</p></div><button class="next" id="next">${session.index+1===session.questions.length?"결과 보기":"다음 문제"} →</button>`:""}`;document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>answer(+b.dataset.answer));if(done)$("#next").onclick=next}
function answer(id){const q=session.questions[session.index];if(q.answer!==null)return;q.answer=id;if(id===q.word.id)saved.wrong=saved.wrong.filter(x=>x!==q.word.id);else if(!saved.wrong.includes(q.word.id))saved.wrong.push(q.word.id);save();renderQuestion()}
function next(){session.index++;session.index===session.questions.length?result():renderQuestion()}
function result(){const qs=session.questions,correct=qs.filter(q=>q.answer===q.word.id).length,wrong=qs.filter(q=>q.answer!==q.word.id).map(q=>q.word);$("#box").innerHTML=`<span class="eyebrow">* QUIZ COMPLETE</span><h2 class="question" style="margin-bottom:0">퀴즈를 마쳤습니다.</h2><div class="score">${Math.round(correct/qs.length*100)}<small>%</small></div><p>${qs.length}문제 중 ${correct}개 정답 · 오답 ${wrong.length}개</p><div class="actions"><button class="next" style="float:none;margin:0" id="again">같은 범위 다시 풀기</button>${wrong.length?'<button class="plain" id="retry">이번 오답만 풀기</button>':""}<button class="plain" id="open-data">자료 보기</button></div>`;$("#again").onclick=()=>startQuiz(qs.map(q=>q.word));if(wrong.length)$("#retry").onclick=()=>startQuiz(wrong);$("#open-data").onclick=()=>go("data")}
function row(w,wrong=false){return`<details><summary class="word"><span class="number">${wrong?WEEK[w.week]:String(w.id%9+1).padStart(2,"0")}</span><strong>${esc(w.word)}</strong><p class="meaning">${esc(w.meaning)}</p><p class="syn">유의어 · ${esc(w.synonyms)}</p><span class="plus">＋</span></summary><div class="detail"><dl><dt>예문</dt><dd>${w.examples.map((e,i)=>`${esc(e)}<br><span class="translation">${esc(w.translations[i])}</span>`).join("<br><br>")}</dd><dt>유의어</dt><dd>${esc(w.synonyms)}</dd><dt>단어 형태</dt><dd>${esc(w.forms)}</dd>${w.note?`<dt>메모</dt><dd class="note">${esc(w.note)}</dd>`:""}</dl></div></details>`}
function renderData(){const q=$("#search").value.trim().toLowerCase(),week=$("#week-filter").value,found=WORDS.filter(w=>(week==="all"||w.week===+week)&&[w.word,w.meaning,w.synonyms,w.forms,...w.examples,...w.translations].join(" ").toLowerCase().includes(q));$("#list").innerHTML=WEEK.map((name,i)=>{const a=found.filter(w=>w.week===i);return a.length?`<section><header class="week-title"><h2>${name}</h2><span>${a.length} WORDS</span></header>${a.map(w=>row(w)).join("")}</section>`:""}).join("")||'<div class="empty"><b>*</b><p>검색 결과가 없습니다.</p></div>'}
$("#search").oninput=renderData;$("#week-filter").onchange=renderData;
function renderWrong(){const a=WORDS.filter(w=>saved.wrong.includes(w.id));$("#wrong-list").innerHTML=a.length?`<button class="start" id="retry-all" style="min-height:48px;padding:0 22px;margin-bottom:16px">오답만 다시 풀기 →</button>${a.map(w=>row(w,true)).join("")}`:'<div class="empty"><b>*</b><h2>오답이 없습니다.</h2><p>퀴즈에서 틀린 단어가 자동으로 모입니다.</p></div>';if(a.length)$("#retry-all").onclick=()=>startQuiz(a)}
function welcome(){$("#box").innerHTML='<div class="welcome"><div><b>*</b><h2>학습 범위를 선택하세요.</h2><p>두 방향의 4지선다 퀴즈와<br>주차별 어휘 자료를 이용할 수 있습니다.</p></div></div>'}save();welcome();
</script>
