<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 2반 알리미</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        /* === 테마 변수 설정 (라이트 모드 기본) === */
        :root {
            --bg: #f7f9fa; /* 아주 밝은 회색 배경 */
            --card-bg: #ffffff;
            --text-main: #111111;
            --text-sub: #757575;
            --accent: #1259c3; /* 삼성 특유의 신뢰감 있는 블루 */
            --border: #e6e8ea;
            --highlight: rgba(18, 89, 195, 0.08);
            --point: #222222;
            --danger: #e63946;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            --btn-text: #ffffff;
        }

        /* === 다크 모드 변수 === */
        :root[data-theme="dark"] {
            --bg: #000000;
            --card-bg: #151515;
            --text-main: #f5f5f5;
            --text-sub: #888888;
            --accent: #4a7dff; /* 어두운 배경에 맞는 밝은 블루 */
            --border: #2a2a2a;
            --highlight: rgba(255, 255, 255, 0.08);
            --point: #444444;
            --danger: #ff5e5e;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --btn-text: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; word-break: keep-all; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            padding: 30px 20px; 
            line-height: 1.6; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            transition: background-color 0.4s ease, color 0.4s ease; /* 부드러운 테마 전환 */
        }
        
        /* 헤더 디자인 (깔끔하고 여백 있게) */
        header { width: 100%; max-width: 1000px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; padding: 10px 0 20px 0; border-bottom: 1px solid var(--border); transition: border-color 0.4s ease; }
        header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -1px; }
        #header-date { color: var(--text-sub); font-weight: 500; font-size: 1.05rem; }
        
        /* 공지사항 리스트 */
        #notice-list-container { width: 100%; max-width: 1000px; margin-bottom: 35px; display: flex; flex-direction: column; gap: 14px; }
        .notice-card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px 28px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); transition: all 0.3s ease; }
        .notice-card:hover { transform: translateY(-3px); border-color: var(--accent); }
        .notice-text { font-weight: 600; font-size: 1.05rem; flex: 1; word-break: break-all; }
        .notice-text span { color: var(--accent); font-weight: 800; margin-right: 8px; }
        
        .delete-btn { background: var(--highlight); color: var(--danger); border: none; padding: 8px 18px; border-radius: 12px; font-size: 0.85rem; font-weight: 700; cursor: pointer; opacity: 0; transition: all 0.2s ease; margin-left: 15px; }
        .notice-card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: var(--danger); color: #fff; transform: scale(1.05); }

        /* 대시보드 레이아웃 */
        .dashboard { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; width: 100%; max-width: 1000px; margin-bottom: 60px; }
        .card { background: var(--card-bg); border-radius: 28px; padding: 32px; border: 1px solid var(--border); box-shadow: var(--shadow); transition: all 0.4s ease; }
        .card-title { font-size: 0.85rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .card-title .tag { background: var(--point); color: #fff; padding: 4px 12px; border-radius: 8px; font-size: 0.75rem; }

        /* 시간표 테이블 */
        .timetable { width: 100%; border-collapse: separate; border-spacing: 0 6px; font-size: 0.95rem; }
        .timetable th { padding: 12px; color: var(--text-sub); font-size: 0.85rem; font-weight: 600; }
        .timetable td { padding: 16px 5px; text-align: center; border-radius: 12px; transition: background 0.3s ease; }
        .today-col { background: var(--highlight) !important; color: var(--accent); font-weight: 800; }

        /* 텍스트 정보 */
        .info-text { font-size: 1.15rem; font-weight: 600; color: var(--text-main); line-height: 1.7; }
        .after-name { font-size: 1.8rem; font-weight: 900; color: var(--accent); display: block; margin-bottom: 8px; letter-spacing: -1px; }

        /* 입력 폼 영역 */
        .notice-input-area { grid-column: span 2; display: flex; gap: 14px; margin-top: 15px; width: 100%; }
        #notice-input { flex: 1; background: var(--card-bg); border: 2px solid var(--border); padding: 18px 26px; color: var(--text-main); border-radius: 20px; outline: none; font-size: 1.05rem; box-shadow: var(--shadow); transition: all 0.3s ease; }
        #notice-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--highlight); }
        .post-btn { background: var(--text-main); color: var(--bg); border: none; padding: 0 40px; font-weight: 800; font-size: 1.05rem; border-radius: 20px; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
        .post-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .post-btn:hover:not(:disabled) { opacity: 0.85; transform: scale(0.98); }

        /* 다크/라이트 모드 플로팅 버튼 */
        .theme-toggle-btn { position: fixed; bottom: 30px; right: 30px; width: 56px; height: 56px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border); box-shadow: var(--shadow); cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 1000; transition: all 0.3s ease; }
        .theme-toggle-btn:hover { transform: scale(1.1); border-color: var(--accent); }
        .theme-toggle-btn svg { width: 24px; height: 24px; fill: var(--text-main); transition: fill 0.4s ease; }

        /* 모바일 반응형 */
        @media (max-width: 850px) { 
            .dashboard { grid-template-columns: 1fr; gap: 20px; } 
            .notice-input-area { grid-column: span 1; flex-direction: column; } 
            .post-btn { padding: 20px; } 
            .delete-btn { opacity: 1; background: var(--danger); color: white; } 
            .theme-toggle-btn { bottom: 20px; right: 20px; width: 50px; height: 50px; }
        }
    </style>
</head>
<body>

<header>
    <h1>2학년 2반 알리미</h1>
    <p id="header-date"></p>
</header>

<div id="notice-list-container">
    </div>

<div class="dashboard">
    <div class="card" style="grid-row: span 2;">
        <div class="card-title">Weekly Schedule <span class="tag">Main</span></div>
        <table class="timetable">
            <thead><tr><th></th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead>
            <tbody id="timetable-body"></tbody>
        </table>
    </div>
    <div class="card">
        <div class="card-title">Menu <span id="meal-tag" class="tag">Loading</span></div>
        <div id="meal-content" class="info-text">데이터 로딩 중...</div>
    </div>
    <div class="card">
        <div class="card-title">After School <span class="tag">Today</span></div>
        <div id="after-school-content"></div>
    </div>
    <div class="notice-input-area">
        <input type="text" id="notice-input" placeholder="학급 친구들에게 전달할 공지사항을 입력하세요">
        <button class="post-btn" id="post-btn" onclick="postNotice()">등록</button>
    </div>
</div>

<button class="theme-toggle-btn" id="theme-btn" aria-label="테마 전환" onclick="toggleTheme()">
    </button>

<script>
    // ⚠️ 앱스크립트 URL
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydC8xGS66OKmKbiLzjmufMe0xXV_1Xj81OKXbLD_NNHtGL_6WSFhyLT7GMi1NKEFPRTg/exec";

    // 🌙 테마(다크/라이트) 설정 로직
    const themeBtn = document.getElementById('theme-btn');
    const root = document.documentElement;

    const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4.5A7.5 7.5 0 1019.5 12 7.508 7.508 0 0012 4.5zm0 13.5a6 6 0 116-6 6.007 6.007 0 01-6 6zM11.25 1.5h1.5v2.25h-1.5zM11.25 20.25h1.5v2.25h-1.5zM20.25 11.25h2.25v1.5h-2.25zM1.5 11.25h2.25v1.5H1.5zM18.082 4.858l1.06-1.06 1.061 1.06-1.06 1.061zM4.858 18.082l1.06-1.06 1.061 1.06-1.06 1.061zM19.142 18.082l-1.06-1.06-1.061 1.06 1.06 1.061zM5.918 4.858l-1.06-1.06-1.061 1.06 1.06 1.061z"/></svg>`;
    const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.56 16.142a9 9 0 01-13.7-13.7 9 9 0 1013.7 13.7z"/></svg>`;

    // 사용자의 시스템 설정이 다크모드인지 확인
    const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

    // 초기 테마 로딩 (시스템 설정 최우선)
    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && prefersDarkScheme.matches)) {
            root.setAttribute('data-theme', 'dark');
            themeBtn.innerHTML = sunIcon;
        } else {
            root.setAttribute('data-theme', 'light');
            themeBtn.innerHTML = moonIcon;
        }
    }

    // 테마 전환 버튼 클릭 시
    function toggleTheme() {
        const currentTheme = root.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            root.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            themeBtn.innerHTML = moonIcon;
        } else {
            root.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            themeBtn.innerHTML = sunIcon;
        }
    }

    // 시스템 설정이 실시간으로 바뀌면 자동으로 반영
    prefersDarkScheme.addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
            if (e.matches) {
                root.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = sunIcon;
            } else {
                root.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = moonIcon;
            }
        }
    });

    initTheme();

    // === 기존 핵심 로직 ===
    const now = new Date();
    const currentDay = now.getDay();
    document.getElementById('header-date').innerText = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + "요일";

    async function loadNotices() {
        const container = document.getElementById('notice-list-container');
        try {
            const res = await fetch(APP_SCRIPT_URL);
            const data = await res.json();
            
            container.innerHTML = ""; 
            if (data.notices && data.notices.length > 0) {
                data.notices.forEach((text, index) => {
                    const div = document.createElement('div');
                    div.className = 'notice-card';
                    div.innerHTML = `<span class="notice-text"><span>Notice</span> ${text}</span><button class="delete-btn" onclick="deleteNotice(${index})">삭제</button>`;
                    container.appendChild(div);
                });
            }
        } catch (e) { console.error("공지 로딩 실패:", e); }
    }

    async function postNotice() {
        const input = document.getElementById('notice-input');
        const btn = document.getElementById('post-btn');
        const text = input.value.trim();
        if(!text) return;

        btn.disabled = true; btn.innerText = "등록 중...";
        
        const params = new URLSearchParams();
        params.append('action', 'add');
        params.append('notice', text);

        try {
            await fetch(APP_SCRIPT_URL, {
                method: "POST",
                body: params
            });
            input.value = '';
            await loadNotices(); 
        } catch (e) {
            alert("서버와 통신 중 문제가 발생했습니다.");
            console.error(e);
        } finally {
            btn.disabled = false; btn.innerText = "등록";
        }
    }

    async function deleteNotice(index) {
        if(!confirm("이 공지사항을 삭제할까요?")) return;
        
        const params = new URLSearchParams();
        params.append('action', 'delete');
        params.append('index', index);

        try {
            await fetch(APP_SCRIPT_URL, {
                method: "POST",
                body: params
            });
            await loadNotices(); 
        } catch (e) {
            alert("삭제에 실패했습니다.");
            console.error(e);
        }
    }

    const schedule = [["인공", "운동", "전수", "고화학", "한국사"], ["인공", "영어1", "운동", "고화학", "미적2"], ["미적2", "고물리", "영어1", "고화학", "고지구"], ["한국사", "고물리", "독작", "한국사", "독작"], ["독작", "전수", "창체2", "미적2", "전수"], ["고생명", "고지구", "창체2", "인공", "영어1"], ["고생명", "고지구", "창체2", "고생명", "고물리"]];
    const tbody = document.getElementById('timetable-body');
    schedule.forEach((row, i) => {
        const tr = document.createElement('tr');
        let html = `<td>${i+1}</td>`;
        row.forEach((sub, idx) => { html += `<td class="${idx + 1 === currentDay ? 'today-col' : ''}">${sub}</td>`; });
        tr.innerHTML = html; tbody.appendChild(tr);
    });

    async function getMeal() {
        const hr = now.getHours(); let targetDate = new Date(now); let mealCode, mealLabel, dayStatus = "오늘";
        if (hr >= 19 || hr < 8) { mealCode = "1"; mealLabel = "조식"; if(hr >= 19) { targetDate.setDate(now.getDate() + 1); dayStatus = "내일"; } } 
        else if (hr >= 8 && hr < 13) { mealCode = "2"; mealLabel = "중식"; } else { mealCode = "3"; mealLabel = "석식"; }
        document.getElementById('meal-tag').innerText = `${dayStatus} ${mealLabel}`;
        const ymd = `${targetDate.getFullYear()}${String(targetDate.getMonth()+1).padStart(2,'0')}${String(targetDate.getDate()).padStart(2,'0')}`;
        try {
            const res = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=eb38b586f6af486b9fa46bf786d629d3&Type=json&ATPT_OFCDC_SC_CODE=N10&SD_SCHUL_CODE=8140071&MLSV_YMD=${ymd}`);
            const data = await res.json();
            if(data.mealServiceDietInfo) {
                const row = data.mealServiceDietInfo[1].row.find(r => r.MMEAL_SC_CODE === mealCode);
                document.getElementById('meal-content').innerText = row ? row.DDISH_NM.replace(/\([^)]*\)/g, "").replace(/<br\/>/g, ", ") : "급식 정보 없음";
            } else { document.getElementById('meal-content').innerText = "급식 없음"; }
        } catch (e) { document.getElementById('meal-content').innerText = "로딩 오류"; }
    }

    const afterSchoolDB = { "03-09": { sub: "생명과학", t: "임미정" }, "03-10": { sub: "물리", t: "박태수" }, "03-11": { sub: "물리", t: "박태수" }, "03-12": { sub: "수학1", t: "김솔이" }, "03-16": { sub: "화학", t: "윤자민" }, "03-17": { sub: "지구과학", t: "김미란" }, "03-18": { sub: "지구과학", t: "김미란" }, "03-19": { sub: "생명과학", t: "임미정" }, "03-23": { sub: "수학1", t: "김솔이" }, "03-24": { sub: "학력평가", t: "전국연합" }, "03-25": { sub: "수학2", t: "정종원" }, "03-26": { sub: "물리", t: "박태수" }, "03-30": { sub: "화학", t: "윤자민" }, "03-31": { sub: "지구과학", t: "김미란" }, "04-01": { sub: "물리", t: "박태수" }, "04-02": { sub: "생명과학", t: "임미정" }, "04-06": { sub: "수학1", t: "김솔이" }, "04-07": { sub: "수학2", t: "정종원" }, "04-08": { sub: "화학", t: "윤자민" }, "04-09": { sub: "생명과학", t: "임미정" } };
    function loadAfterSchool() {
        const key = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const target = document.getElementById('after-school-content');
        if (afterSchoolDB[key]) target.innerHTML = `<span class="after-name">${afterSchoolDB[key].sub}</span><span class="after-teacher">${afterSchoolDB[key].t} 선생님</span>`;
        else target.innerHTML = `<div style="color: var(--text-sub); font-size:0.95rem;">예정된 방과후 없음</div>`;
    }

    window.onload = () => { loadNotices(); getMeal(); loadAfterSchool(); };
</script>
</body>
</html>
