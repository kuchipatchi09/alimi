<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QPI 2-2 알리미</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        :root {
            --bg: #0a0a0a;
            --card-bg: #151515;
            --text-main: #ffffff;
            --text-sub: #888888;
            --accent: #ffffff;
            --border: #333333;
            --highlight: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; word-break: keep-all; }
        body { background-color: var(--bg); color: var(--text-main); padding: 20px; line-height: 1.6; }

        header { max-width: 1000px; margin: 0 auto 30px auto; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        header h1 { font-size: 1.5rem; font-weight: 800; }
        header p { font-size: 0.9rem; color: var(--text-sub); }

        #top-notice-banner {
            max-width: 1000px; margin: 0 auto 20px auto; padding: 12px 20px;
            background: var(--card-bg); border-left: 4px solid var(--accent);
            display: none; font-weight: 600; font-size: 0.95rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
        .card-title { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .card-title::before { content: ''; display: inline-block; width: 4px; height: 12px; background: var(--accent); }
        
        /* 시간표 디자인 */
        .timetable { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .timetable th { padding: 10px; color: var(--text-sub); font-weight: 600; border-bottom: 1px solid var(--border); }
        .timetable td { padding: 12px 5px; text-align: center; border-bottom: 1px solid #222; }
        .today-col { background-color: var(--highlight); color: var(--accent); font-weight: 700; border-radius: 4px; }

        /* 급식 및 방과후 */
        .info-text { font-size: 1rem; font-weight: 500; min-height: 50px; display: flex; align-items: center; color: #ddd; }
        .after-item { text-align: left; }
        .after-name { font-size: 1.4rem; font-weight: 800; display: block; margin-bottom: 4px; color: var(--accent); }
        .after-teacher { font-size: 0.9rem; color: var(--text-sub); }

        /* 하단 입력 영역 */
        .notice-input-area { grid-column: span 2; display: flex; gap: 10px; margin-top: 10px; }
        #notice-input { flex: 1; background: var(--card-bg); border: 1px solid var(--border); padding: 12px 15px; color: #fff; border-radius: 8px; outline: none; transition: 0.2s; }
        #notice-input:focus { border-color: var(--accent); }
        .post-btn { background: #fff; color: #000; border: none; padding: 0 25px; font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .post-btn:hover { opacity: 0.8; }

        @media (max-width: 800px) { 
            .dashboard { grid-template-columns: 1fr; } 
            .notice-input-area { grid-column: span 1; }
            header { flex-direction: column; align-items: flex-start; gap: 5px; }
        }
    </style>
</head>
<body>

<header>
    <h1>2학년 2반 알리미</h1>
    <p id="today-date"></p>
</header>

<div id="top-notice-banner">
    📢 <span id="display-notice"></span>
</div>

<div class="dashboard">
    <div class="card" style="grid-row: span 2;">
        <div class="card-title">Weekly Schedule</div>
        <table class="timetable">
            <thead>
                <tr><th></th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr>
            </thead>
            <tbody id="timetable-body"></tbody>
        </table>
    </div>

    <div class="card">
        <div class="card-title" id="meal-title">MENU</div>
        <div id="meal-content" class="info-text">정보를 불러오는 중...</div>
    </div>

    <div class="card">
        <div class="card-title">After School</div>
        <div id="after-school-content"></div>
    </div>

    <div class="notice-input-area">
        <input type="text" id="notice-input" placeholder="학급 전달사항을 입력하세요">
        <button class="post-btn" onclick="postNotice()">등록</button>
    </div>
</div>

<script>
    const dateObj = new Date();
    const currentDay = dateObj.getDay(); // 0(일)~6(토)
    
    document.getElementById('today-date').innerText = dateObj.toLocaleDateString('ko-KR', { 
        year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' 
    });

    // 공지 등록
    function postNotice() {
        const input = document.getElementById('notice-input');
        if(input.value.trim() !== "") {
            document.getElementById('display-notice').innerText = input.value;
            document.getElementById('top-notice-banner').style.display = 'block';
            input.value = '';
            window.scrollTo({top: 0, behavior: 'smooth'});
        }
    }

    // 시간표 렌더링 (오늘 요일 하이라이트 추가)
    const schedule = [
        ["인공", "운동", "전수", "고화학", "한국사"],
        ["인공", "영어1", "운동", "고화학", "미적2"],
        ["미적2", "고물리", "영어1", "고화학", "고지구"],
        ["한국사", "고물리", "독작", "한국사", "독작"],
        ["독작", "전수", "창체2", "미적2", "전수"],
        ["고생명", "고지구", "창체2", "인공", "영어1"],
        ["고생명", "고지구", "창체2", "고생명", "고물리"]
    ];

    const tbody = document.getElementById('timetable-body');
    schedule.forEach((row, i) => {
        const tr = document.createElement('tr');
        let rowHtml = `<td style="color:#666; font-size:0.75rem;">${i+1}</td>`;
        
        row.forEach((sub, idx) => {
            const isToday = (idx + 1 === currentDay);
            rowHtml += `<td class="${isToday ? 'today-col' : ''}">${sub}</td>`;
        });
        
        tr.innerHTML = rowHtml;
        tbody.appendChild(tr);
    });

    // 급식 로직 (요청하신 시간대 반영)
    const API_KEY = "eb38b586f6af486b9fa46bf786d629d3";
    const ATPT_CODE = "N10"; 
    const SD_CODE = "8140071"; 

    async function getMeal() {
        const hr = dateObj.getHours();
        let code = "2"; 
        let label = "중식";
        let targetDate = new Date(dateObj);

        // 시간대별 분기
        if (hr >= 19 || hr < 8) { 
            code = "1"; label = "조식"; 
            if(hr >= 19) targetDate.setDate(dateObj.getDate() + 1); // 밤 7시 이후엔 내일 조식
        } 
        else if (hr >= 8 && hr < 13) { code = "2"; label = "중식"; }
        else if (hr >= 13 && hr < 19) { code = "3"; label = "석식"; }

        document.getElementById('meal-title').innerText = label;
        const ymd = targetDate.toISOString().split('T')[0].replace(/-/g, "");

        try {
            const response = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=${API_KEY}&Type=json&ATPT_OFCDC_SC_CODE=${ATPT_CODE}&SD_SCHUL_CODE=${SD_CODE}&MLSV_YMD=${ymd}`);
            const data = await response.json();
            if(data.mealServiceDietInfo) {
                const meal = data.mealServiceDietInfo[1].row.find(r => r.MMEAL_SC_CODE === code);
                document.getElementById('meal-content').innerText = meal ? meal.DDISH_NM.replace(/\([^)]*\)/g, "").replace(/<br\/>/g, ", ") : `${label} 정보가 없습니다.`;
            } else { document.getElementById('meal-content').innerText = "급식 정보가 없습니다."; }
        } catch (e) { document.getElementById('meal-content').innerText = "데이터 호출 오류"; }
    }
    getMeal();

    // 방과후 데이터
    const afterSchoolDB = {
        "03-09": { sub: "생명과학", t: "임미정" }, "03-10": { sub: "물리", t: "박태수" },
        "03-11": { sub: "물리", t: "박태수" }, "03-12": { sub: "수학1", t: "김솔이" },
        "03-16": { sub: "화학", t: "윤자민" }, "03-17": { sub: "지구과학", t: "김미란" },
        "03-18": { sub: "지구과학", t: "김미란" }, "03-19": { sub: "생명과학", t: "임미정" },
        "03-23": { sub: "수학1", t: "김솔이" }, "03-24": { sub: "학력평가", t: "전국연합" },
        "03-25": { sub: "수학2", t: "정종원" }, "03-26": { sub: "물리", t: "박태수" },
        "03-30": { sub: "화학", t: "윤자민" }, "03-31": { sub: "지구과학", t: "김미란" },
        "04-01": { sub: "물리", t: "박태수" }, "04-02": { sub: "생명과학", t: "임미정" },
        "04-06": { sub: "수학1", t: "김솔이" }, "04-07": { sub: "수학2", t: "정종원" },
        "04-08": { sub: "화학", t: "윤자민" }, "04-09": { sub: "생명과학", t: "임미정" }
    };

    function loadAfterSchool() {
        const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
        const dd = String(dateObj.getDate()).padStart(2, '0');
        const todayKey = `${mm}-${dd}`;
        const container = document.getElementById('after-school-content');

        if (afterSchoolDB[todayKey]) {
            container.innerHTML = `
                <div class="after-item">
                    <span class="after-name">${afterSchoolDB[todayKey].sub}</span>
                    <span class="after-teacher">${afterSchoolDB[todayKey].t} 선생님</span>
                </div>
            `;
        } else {
            container.innerHTML = `<div class="info-text" style="color:var(--text-sub); font-size:0.9rem;">오늘 예정된 방과후가 없습니다.</div>`;
        }
    }
    loadAfterSchool();
</script>

</body>
</html>
