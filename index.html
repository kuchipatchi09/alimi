<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>시험 플래너</title>
<meta name="description" content="과목별로 공부와 수행평가를 관리하는 개인 시험 플래너">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">시험<em>플래너</em></span>
    </div>
    <div class="topbar-actions">
      <span class="sync-indicator" id="syncIndicator" title="동기화 상태">
        <span class="sync-dot" id="syncDot"></span>
        <span class="sync-text" id="syncText">로컬</span>
      </span>
      <button class="icon-btn" id="themeToggle" title="테마 전환" aria-label="테마 전환">
        <svg id="iconSun" viewBox="0 0 24 24" width="18" height="18"><path d="M12 4.5V2M12 22v-2.5M4.5 12H2M22 12h-2.5M5.6 5.6 4 4M20 20l-1.6-1.6M5.6 18.4 4 20M20 4l-1.6 1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/></svg>
        <svg id="iconMoon" viewBox="0 0 24 24" width="18" height="18" style="display:none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 1 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Overview ===== -->
  <section class="overview">
    <div class="ring-card">
      <svg class="ring" viewBox="0 0 120 120" width="112" height="112">
        <circle class="ring-track" cx="60" cy="60" r="52" />
        <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="52" />
      </svg>
      <div class="ring-label">
        <span class="ring-num" id="overallPct">0<small>%</small></span>
        <span class="ring-sub">전체 진행률</span>
      </div>
    </div>
    <div class="overview-stats">
      <div class="stat">
        <span class="stat-num" id="statDone">0</span>
        <span class="stat-label">완료</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statTodo">0</span>
        <span class="stat-label">남은 항목</span>
      </div>
      <div class="stat">
        <span class="stat-num" id="statSubjects">0</span>
        <span class="stat-label">과목 수</span>
      </div>
    </div>
    <div class="due-panel" id="duePanel">
      <h3>다가오는 마감</h3>
      <ul id="dueList" class="due-list"></ul>
      <p class="empty-mini" id="dueEmpty">마감이 임박한 항목이 없어요.</p>
    </div>
  </section>

  <!-- ===== Main layout ===== -->
  <section class="layout">

    <!-- Sidebar: subjects -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>과목</h2>
        <button class="add-btn" id="addSubjectBtn">+ 과목 추가</button>
      </div>
      <ul class="subject-list" id="subjectList"></ul>
      <p class="empty-mini" id="subjectEmpty">아직 과목이 없어요. 먼저 과목을 추가해보세요.</p>
    </aside>

    <!-- Main panel: tasks -->
    <main class="panel" id="mainPanel">
      <div class="panel-empty" id="panelEmpty">
        <p>왼쪽에서 과목을 선택하거나<br>새 과목을 추가해보세요.</p>
      </div>

      <div class="panel-content" id="panelContent" hidden>
        <div class="subject-header">
          <div class="subject-title-row">
            <span class="subject-dot" id="curDot"></span>
            <h2 id="curName">과목명</h2>
            <button class="icon-btn small" id="editSubjectBtn" title="과목 수정" aria-label="과목 수정">
              <svg viewBox="0 0 24 24" width="15" height="15"><path d="M4 20h4L19.5 8.5a2 2 0 0 0-4-4L4 16v4Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            </button>
            <button class="icon-btn small danger" id="deleteSubjectBtn" title="과목 삭제" aria-label="과목 삭제">
              <svg viewBox="0 0 24 24" width="15" height="15"><path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <span class="dday-chip" id="curDday" hidden></span>
        </div>

        <div class="subject-progress">
          <div class="bar-track"><div class="bar-fill" id="curBarFill"></div></div>
          <span class="bar-text" id="curBarText">0 / 0 완료</span>
        </div>

        <form class="task-form" id="taskForm">
          <input type="text" id="taskTitle" placeholder="할 일을 입력하세요 (예: 3단원 문제풀이)" maxlength="80" required>
          <select id="taskType">
            <option value="study">공부</option>
            <option value="assignment">수행평가</option>
            <option value="etc">기타</option>
          </select>
          <input type="date" id="taskDue" title="마감일 (선택)">
          <button type="submit" class="add-btn primary">추가</button>
        </form>

        <div class="filter-row">
          <button class="filter-btn active" data-filter="all">전체</button>
          <button class="filter-btn" data-filter="active">진행중</button>
          <button class="filter-btn" data-filter="done">완료</button>
          <span class="filter-hint">칸을 드래그해서 순서를 바꿀 수 있어요</span>
        </div>

        <ul class="task-list" id="taskList"></ul>
        <p class="empty-mini" id="taskEmpty">이 과목에 할 일이 없어요.</p>
      </div>
    </main>
  </section>
</div>

<!-- ===== Subject modal ===== -->
<div class="modal-backdrop" id="subjectModalBackdrop" hidden>
  <div class="modal">
    <h3 id="subjectModalTitle">과목 추가</h3>
    <label class="field">
      <span>과목 이름</span>
      <input type="text" id="subjectNameInput" placeholder="예: 수학" maxlength="20">
    </label>
    <label class="field">
      <span>색상</span>
      <div class="swatch-row" id="swatchRow"></div>
    </label>
    <label class="field">
      <span>시험일 (선택)</span>
      <input type="date" id="subjectExamInput">
    </label>
    <div class="modal-actions">
      <button class="btn ghost" id="subjectCancelBtn" type="button">취소</button>
      <button class="btn primary" id="subjectSaveBtn" type="button">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
