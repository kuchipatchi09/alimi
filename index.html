<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 2반 알리미</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        :root {
            --bg: #050505; --card-bg: #151515; --text-main: #ffffff;
            --text-sub: #999999; --accent: #ffffff; --border: #333333;
            --highlight: rgba(255, 255, 255, 0.1); --point: #555555; --danger: #ff4d4d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; word-break: keep-all; }
        body { background-color: var(--bg); color: var(--text-main); padding: 20px; line-height: 1.6; display: flex; flex-direction: column; align-items: center; }
        
        header { width: 100%; max-width: 1000px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: flex-end; padding: 20px 0 15px 0; border-bottom: 1px solid var(--border); }
        header h1 { font-size: 1.6rem; font-weight: 900; letter-spacing: -1px; }
        
        /* 공지사항 카드 리스트 */
        #notice-list-container { width: 100%; max-width: 1000px; margin-bottom: 25px; display: flex; flex-direction: column; gap: 12px; }
        .notice-card { background: var(--card-bg); border: 1px solid var(--border); padding: 18px 24px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s ease, border-color 0.2s ease; }
        .notice-card:hover { border-color: #666; transform: translateY(-2px); }
        .notice-text { font-weight: 600; font-size: 1.05rem; color: #fff; flex: 1; word-break: break-all; }
        .delete-btn { background: var(--danger); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 800; cursor: pointer; opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; margin-left: 15px; }
        .notice-card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: #ff1a1a; transform: scale(1.05); }

        /* 대시보드 레이아웃 */
        .dashboard { display: grid; grid-template-columns: 1.5fr 1fr; gap: 24px; width: 100%; max-width: 1000px; }
        .card { background: var(--card-bg); border-radius: 20px; padding: 28px; border: 1px solid var(--border); }
        .card-title { font-size: 0.85rem; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .card-title .tag { background: var(--point); color: #fff; padding: 3px 10px; border-radius: 6px; font-size: 0.75rem; }

        .timetable { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 0.95rem; }
        .timetable th { padding: 12px; color: var(--text-sub); font-size: 0.8rem; }
        .timetable td { padding: 14px 5px; text-align: center; background: rgba(255,255,255,0.03); }
        .today-col { background: var(--highlight) !important; color: #fff; font-weight: 800; }

        .info-text { font-size: 1.1rem; font-weight: 600; color: #eee; }
        .after-name { font-size: 1.6rem; font-weight: 900; color: #fff; display: block; margin-bottom: 5px; }

        .notice-input-area { grid-column: span 2; display: flex; gap: 12px; margin-top: 10px; width: 100%; max-width: 1000px; }
        #notice-input { flex: 1; background: var(--card-bg); border: 1px solid var(--border); padding: 16px 20px; color: #fff; border-radius: 14px; outline: none; font-size: 1rem; transition: border-color 0.2s; }
        #notice-input:focus { border-color: var(--text-sub); }
        .post-btn { background: #fff; color: #000; border: none; padding: 0 35px; font-weight: 800; border-radius: 14px; cursor: pointer; transition: opacity 0.2s; }
        .post-btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .post-btn:hover:not(:disabled) { opacity: 0.8; }

        @media (max-width: 850px) { .dashboard { grid-template-columns: 1fr; } .notice-input-area { grid-column: span 1; flex-direction: column; } .post-btn { padding: 18px; } .delete-btn { opacity: 1; } }
    </style>
</head>
<body>

<header>
    <h1>2학년 2반 알리미</h1>
    <p id="header-date"></p>
</header>

<div id="notice-list-container"></div>

<div class="dashboard">
    <div class="card" style="grid-row: span 2;">
        <div class="card-title">Weekly Schedule <span class="tag">Main</span></div>
        <table class="timetable">
            <thead><tr><th></th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead>
            <tbody id="timetable-body"></tbody>
        </table>
    </div>
    <div class="card">
        <div class="card-title">Menu <span id="meal-tag" class="tag">Loading</span></div>
        <div id="meal-content" class="info-text">데이터 로딩 중...</div>
    </div>
    <div class="card">
        <div class="card-title">After School <span class="tag">Today</span></div>
        <div id="after-school-content"></div>
    </div>
    <div class="notice-input-area">
        <input type="text" id="notice-input" placeholder="학급 친구들에게 전달할 공지사항을 입력하세요.">
        <button class="post-btn" id="post-btn" onclick="postNotice()">등록</button>
    </div>
</div>

<script>
    // ⚠️ 이곳에 방금 배포한 앱스크립트 웹앱 URL을 넣어주세요!
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydC8xGS66OKmKbiLzjmufMe0xXV_1Xj81OKXbLD_NNHtGL_6WSFhyLT7GMi1NKEFPRTg/exec";

    const now = new Date();
    const currentDay = now.getDay();
    document.getElementById('header-date').innerText = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + "요일";

    async function loadNotices() {
        const container = document.getElementById('notice-list-container');
        try {
            const res = await fetch(APP_SCRIPT_URL);
            const data = await res.json();
            
            container.innerHTML = ""; 
            if (data.notices && data.notices.length > 0) {
                data.notices.forEach((text, index) => {
                    const div = document.createElement('div');
                    div.className = 'notice-card';
                    div.innerHTML = `<span class="notice-text">📢 ${text}</span><button class="delete-btn" onclick="deleteNotice(${index})">삭제</button>`;
                    container.appendChild(div);
                });
            }
        } catch (e) { console.error("공지 로딩 실패:", e); }
    }

    async function postNotice() {
        const input = document.getElementById('notice-input');
        const btn = document.getElementById('post-btn');
        const text = input.value.trim();
        if(!text) return;

        btn.disabled = true; btn.innerText = "등록 중...";
        
        const params = new URLSearchParams();
        params.append('action', 'add');
        params.append('notice', text);

        try {
            await fetch(APP_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // 🚀 [핵심] 구글 서버의 응답을 무시하고 전송만 강제합니다!
                body: params
            });
            input.value = '';
            // 서버에 데이터가 기록될 시간을 잠깐 준 뒤 목록을 새로고침합니다 (0.8초)
            setTimeout(loadNotices, 800); 
        } catch (e) {
            alert("전송 중 오류 발생");
            console.error(e);
        } finally {
            btn.disabled = false; btn.innerText = "등록";
        }
    }

    async function deleteNotice(index) {
        if(!confirm("이 공지사항을 삭제할까요?")) return;
        
        const params = new URLSearchParams();
        params.append('action', 'delete');
        params.append('index', index);

        try {
            await fetch(APP_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // 🚀 [핵심] 삭제도 마찬가지로 에러를 회피합니다!
                body: params
            });
            setTimeout(loadNotices, 800);
        } catch (e) {
            alert("삭제 중 오류 발생");
            console.error(e);
        }
    }

    // 시간표 및 급식 로직
    const schedule = [["인공", "운동", "전수", "고화학", "한국사"], ["인공", "영어1", "운동", "고화학", "미적2"], ["미적2", "고물리", "영어1", "고화학", "고지구"], ["한국사", "고물리", "독작", "한국사", "독작"], ["독작", "전수", "창체2", "미적2", "전수"], ["고생명", "고지구", "창체2", "인공", "영어1"], ["고생명", "고지구", "창체2", "고생명", "고물리"]];
    const tbody = document.getElementById('timetable-body');
    schedule.forEach((row, i) => {
        const tr = document.createElement('tr');
        let html = `<td>${i+1}</td>`;
        row.forEach((sub, idx) => { html += `<td class="${idx + 1 === currentDay ? 'today-col' : ''}">${sub}</td>`; });
        tr.innerHTML = html; tbody.appendChild(tr);
    });

    async function getMeal() {
        const hr = now.getHours(); let targetDate = new Date(now); let mealCode, mealLabel, dayStatus = "오늘";
        if (hr >= 19 || hr < 8) { mealCode = "1"; mealLabel = "조식"; if(hr >= 19) { targetDate.setDate(now.getDate() + 1); dayStatus = "내일"; } } 
        else if (hr >= 8 && hr < 13) { mealCode = "2"; mealLabel = "중식"; } else { mealCode = "3"; mealLabel = "석식"; }
        document.getElementById('meal-tag').innerText = `${dayStatus} ${mealLabel}`;
        const ymd = `${targetDate.getFullYear()}${String(targetDate.getMonth()+1).padStart(2,'0')}${String(targetDate.getDate()).padStart(2,'0')}`;
        try {
            const res = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=eb38b586f6af486b9fa46bf786d629d3&Type=json&ATPT_OFCDC_SC_CODE=N10&SD_SCHUL_CODE=8140071&MLSV_YMD=${ymd}`);
            const data = await res.json();
            if(data.mealServiceDietInfo) {
                const row = data.mealServiceDietInfo[1].row.find(r => r.
