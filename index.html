<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 2반 알리미</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        /* === 우주 최강 화려한 테마 변수 설정 === */
        :root {
            /* 라이트 모드 (홀로그램 / 베이퍼웨이브 스타일) */
            --bg-grad-1: #ff9a9e; --bg-grad-2: #fecfef; --bg-grad-3: #a1c4fd; --bg-grad-4: #c2e9fb;
            --card-bg: rgba(255, 255, 255, 0.4);
            --text-main: #111; --text-sub: #444;
            --accent: #ff0844; --accent-glow: rgba(255, 8, 68, 0.6);
            --border: rgba(255, 255, 255, 0.8);
            --highlight: rgba(255, 255, 255, 0.6);
            --point: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            --danger: #ff0844;
            --shadow-neon: 0 0 20px rgba(255, 154, 158, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.8);
            --btn-text: #fff;
        }

        :root[data-theme="dark"] {
            /* 다크 모드 (사이버펑크 / 네온 레이브 스타일) */
            --bg-grad-1: #0f2027; --bg-grad-2: #203a43; --bg-grad-3: #2c5364; --bg-grad-4: #4a00e0;
            --card-bg: rgba(10, 10, 20, 0.55);
            --text-main: #fff; --text-sub: #aaa;
            --accent: #00ffcc; --accent-glow: rgba(0, 255, 204, 0.8);
            --border: rgba(0, 255, 204, 0.3);
            --highlight: rgba(0, 255, 204, 0.15);
            --point: linear-gradient(135deg, #8e2de2 0%, #4a00e0 100%);
            --danger: #ff0055;
            --shadow-neon: 0 0 25px rgba(0, 255, 204, 0.2), inset 0 0 10px rgba(0, 255, 204, 0.1);
            --btn-text: #000;
        }

        /* === 미친 애니메이션 모음 === */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        @keyframes neonPulse {
            0% { text-shadow: 0 0 5px var(--text-main), 0 0 10px var(--accent-glow); }
            50% { text-shadow: 0 0 10px var(--text-main), 0 0 30px var(--accent), 0 0 40px var(--accent); }
            100% { text-shadow: 0 0 5px var(--text-main), 0 0 10px var(--accent-glow); }
        }
        @keyframes borderDance {
            0% { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
            50% { border-color: #ff00ff; box-shadow: 0 0 30px rgba(255, 0, 255, 0.8); }
            100% { border-color: var(--accent); box-shadow: 0 0 20px var(--accent-glow); }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; word-break: keep-all; }
        
        body { 
            /* 살아 숨쉬는 그라데이션 배경 */
            background: linear-gradient(-45deg, var(--bg-grad-1), var(--bg-grad-2), var(--bg-grad-3), var(--bg-grad-4));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main); 
            padding: 30px 20px; 
            line-height: 1.6; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            overflow-x: hidden;
            transition: color 0.4s ease;
        }
        
        /* 헤더 디자인: 미친 네온 텍스트 */
        header { width: 100%; max-width: 1050px; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end; padding: 15px 20px; border-bottom: 2px solid var(--border); background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; box-shadow: var(--shadow-neon); }
        header h1 { font-size: 2.2rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; animation: neonPulse 2s infinite; color: var(--text-main); }
        #header-date { color: var(--text-main); font-weight: 800; font-size: 1.2rem; background: var(--point); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* 공지사항 리스트: 둥둥 떠다니는 유리 카드 */
        #notice-list-container { width: 100%; max-width: 1050px; margin-bottom: 40px; display: flex; flex-direction: column; gap: 18px; }
        .notice-card { background: var(--card-bg); border: 1px solid var(--border); padding: 22px 30px; border-radius: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-neon); backdrop-filter: blur(25px) saturate(150%); -webkit-backdrop-filter: blur(25px) saturate(150%); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); animation: float 6s ease-in-out infinite; }
        .notice-card:nth-child(even) { animation-delay: 1s; }
        .notice-card:nth-child(3n) { animation-delay: 2s; }
        .notice-card:hover { transform: scale(1.03) translateY(-10px) rotateX(5deg); border-color: var(--accent); box-shadow: 0 15px 35px var(--accent-glow), inset 0 0 20px var(--accent-glow); z-index: 10; }
        .notice-text { font-weight: 700; font-size: 1.15rem; flex: 1; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .notice-text span { color: var(--accent); font-weight: 900; margin-right: 12px; font-size: 1.3rem; text-shadow: 0 0 10px var(--accent-glow); }
        
        .delete-btn { background: var(--danger); color: #fff; border: 2px solid transparent; padding: 10px 22px; border-radius: 14px; font-size: 0.9rem; font-weight: 800; cursor: pointer; opacity: 0; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(255, 0, 85, 0.6); margin-left: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .notice-card:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: transparent; border-color: var(--danger); color: var(--danger); transform: scale(1.1) rotate(3deg); box-shadow: 0 0 30px var(--danger); }

        /* 대시보드 레이아웃: 글래스모피즘 극대화 */
        .dashboard { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; width: 100%; max-width: 1050px; margin-bottom: 80px; }
        .card { background: var(--card-bg); border-radius: 35px; padding: 35px; border: 1px solid var(--border); box-shadow: var(--shadow-neon); backdrop-filter: blur(30px) saturate(200%); -webkit-backdrop-filter: blur(30px) saturate(200%); transition: all 0.5s ease; position: relative; overflow: hidden; }
        .card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, var(--highlight) 0%, transparent 60%); opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        .card:hover::before { opacity: 1; animation: spin 10s linear infinite; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.3), 0 0 20px var(--accent-glow); border-color: var(--accent); }

        .card-title { font-size: 1rem; font-weight: 900; color: var(--text-main); text-transform: uppercase; letter-spacing: 3px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; }
        .card-title .tag { background: var(--point); color: #fff; padding: 6px 16px; border-radius: 12px; font-size: 0.8rem; font-weight: 900; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }

        /* 시간표 테이블: 형광펜 칠한 느낌 */
        .timetable { width: 100%; border-collapse: separate; border-spacing: 4px; font-size: 1.05rem; }
        .timetable th { padding: 15px; color: var(--text-sub); font-size: 0.9rem; font-weight: 800; letter-spacing: 1px; }
        .timetable td { padding: 18px 5px; text-align: center; border-radius: 16px; background: rgba(255,255,255,0.05); font-weight: 600; transition: all 0.3s ease; border: 1px solid transparent; }
        .timetable td:hover { background: var(--highlight); transform: scale(1.1); border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); z-index: 5; position: relative; }
        .today-col { background: var(--highlight) !important; color: var(--accent); font-weight: 900; border: 2px solid var(--accent) !important; box-shadow: 0 0 20px var(--accent-glow); animation: neonPulse 3s infinite; }

        /* 텍스트 정보 */
        .info-text { font-size: 1.3rem; font-weight: 700; color: var(--text-main); line-height: 1.8; text-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .after-name { font-size: 2.5rem; font-weight: 900; background: var(--point); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: block; margin-bottom: 10px; letter-spacing: -2px; filter: drop-shadow(0 0 10px var(--accent-glow)); }

        /* 입력 폼 영역: 레이저 발사 준비 */
        .notice-input-area { grid-column: span 2; display: flex; gap: 20px; margin-top: 20px; width: 100%; position: relative; }
        #notice-input { flex: 1; background: rgba(0,0,0,0.2); border: 2px solid var(--border); padding: 22px 30px; color: var(--text-main); border-radius: 25px; outline: none; font-size: 1.2rem; font-weight: 600; backdrop-filter: blur(10px); transition: all 0.3s ease; }
        #notice-input::placeholder { color: var(--text-sub); font-weight: 500; }
        #notice-input:focus { animation: borderDance 2s infinite; background: rgba(0,0,0,0.4); outline: none; }
        
        .post-btn { background: var(--point); color: #fff; border: none; padding: 0 50px; font-weight: 900; font-size: 1.2rem; border-radius: 25px; cursor: pointer; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .post-btn:disabled { filter: grayscale(100%); cursor: not-allowed; }
        .post-btn:hover:not(:disabled) { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 35px var(--accent-glow); filter: brightness(1.2); }

        /* 플로팅 테마 버튼: 미러볼 회전 효과 */
        .theme-toggle-btn { position: fixed; bottom: 40px; right: 40px; width: 70px; height: 70px; border-radius: 50%; background: var(--point); border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.4), 0 0 20px var(--accent-glow); cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 1000; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .theme-toggle-btn:hover { transform: scale(1.2) rotate(360deg); }
        .theme-toggle-btn svg { width: 32px; height: 32px; fill: #fff; filter: drop-shadow(0 0 5px rgba(255,255,255,0.8)); }

        @media (max-width: 850px) { 
            .dashboard { grid-template-columns: 1fr; gap: 25px; } 
            .notice-input-area { grid-column: span 1; flex-direction: column; } 
            .post-btn { padding: 25px; } 
            .delete-btn { opacity: 1; } 
            .theme-toggle-btn { bottom: 25px; right: 25px; width: 60px; height: 60px; }
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<header>
    <h1>2학년 2반 화끈해용</h1>
    <p id="header-date"></p>
</header>

<div id="notice-list-container">
    </div>

<div class="dashboard">
    <div class="card" style="grid-row: span 2;">
        <div class="card-title"> Weekly Schedule <span class="tag">Main</span></div>
        <table class="timetable">
            <thead><tr><th></th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead>
            <tbody id="timetable-body"></tbody>
        </table>
    </div>
    <div class="card">
        <div class="card-title"> Menu <span id="meal-tag" class="tag">Loading</span></div>
        <div id="meal-content" class="info-text">데이터 로딩 중...</div>
    </div>
    <div class="card">
        <div class="card-title"> After School <span class="tag">Today</span></div>
        <div id="after-school-content"></div>
    </div>
    <div class="notice-input-area">
        <input type="text" id="notice-input" placeholder="공지사항을 입력하세요.">
        <button class="post-btn" id="post-btn" onclick="postNotice()">전송</button>
    </div>
</div>

<button class="theme-toggle-btn" id="theme-btn" aria-label="테마 전환" onclick="toggleTheme()">
</button>

<script>
    // ⚠️ 앱스크립트 URL
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydC8xGS66OKmKbiLzjmufMe0xXV_1Xj81OKXbLD_NNHtGL_6WSFhyLT7GMi1NKEFPRTg/exec";

    const themeBtn = document.getElementById('theme-btn');
    const root = document.documentElement;

    const sunIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4.5A7.5 7.5 0 1019.5 12 7.508 7.508 0 0012 4.5zm0 13.5a6 6 0 116-6 6.007 6.007 0 01-6 6zM11.25 1.5h1.5v2.25h-1.5zM11.25 20.25h1.5v2.25h-1.5zM20.25 11.25h2.25v1.5h-2.25zM1.5 11.25h2.25v1.5H1.5zM18.082 4.858l1.06-1.06 1.061 1.06-1.06 1.061zM4.858 18.082l1.06-1.06 1.061 1.06-1.06 1.061zM19.142 18.082l-1.06-1.06-1.061 1.06 1.06 1.061zM5.918 4.858l-1.06-1.06-1.061 1.06 1.06 1.061z"/></svg>`;
    const moonIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M21.56 16.142a9 9 0 01-13.7-13.7 9 9 0 1013.7 13.7z"/></svg>`;

    const prefersDarkScheme = window.matchMedia("(prefers-color-scheme: dark)");

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && prefersDarkScheme.matches)) {
            root.setAttribute('data-theme', 'dark');
            themeBtn.innerHTML = sunIcon;
        } else {
            root.setAttribute('data-theme', 'light');
            themeBtn.innerHTML = moonIcon;
        }
    }

    function toggleTheme() {
        const currentTheme = root.getAttribute('data-theme');
        if (currentTheme === 'dark') {
            root.setAttribute('data-theme', 'light');
            localStorage.setItem('theme', 'light');
            themeBtn.innerHTML = moonIcon;
        } else {
            root.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
            themeBtn.innerHTML = sunIcon;
        }
    }

    prefersDarkScheme.addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
            if (e.matches) {
                root.setAttribute('data-theme', 'dark');
                themeBtn.innerHTML = sunIcon;
            } else {
                root.setAttribute('data-theme', 'light');
                themeBtn.innerHTML = moonIcon;
            }
        }
    });

    initTheme();

    const now = new Date();
    const currentDay = now.getDay();
    document.getElementById('header-date').innerText = now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short' }) + "요일";

    async function loadNotices() {
        const container = document.getElementById('notice-list-container');
        try {
            const res = await fetch(APP_SCRIPT_URL);
            const data = await res.json();
            
            container.innerHTML = ""; 
            if (data.notices && data.notices.length > 0) {
                data.notices.forEach((text, index) => {
                    const div = document.createElement('div');
                    div.className = 'notice-card';
                    div.innerHTML = `<span class="notice-text"><span>[공지]</span> ${text}</span><button class="delete-btn" onclick="deleteNotice(${index})">지우기</button>`;
                    container.appendChild(div);
                });
            }
        } catch (e) { console.error("공지 로딩 실패:", e); }
    }

    async function postNotice() {
        const input = document.getElementById('notice-input');
        const btn = document.getElementById('post-btn');
        const text = input.value.trim();
        if(!text) return;

        btn.disabled = true; btn.innerText = "전송 중...";
        
        const params = new URLSearchParams();
        params.append('action', 'add');
        params.append('notice', text);

        try {
            await fetch(APP_SCRIPT_URL, {
                method: "POST",
                body: params
            });
            input.value = '';
            await loadNotices(); 
        } catch (e) {
            alert("서버와 통신 중 문제가 발생했습니다.");
            console.error(e);
        } finally {
            btn.disabled = false; btn.innerText = "전송 완료!";
            setTimeout(() => { btn.innerText = "전송"; }, 1000);
        }
    }

    async function deleteNotice(index) {
        if(!confirm("진짜로 삭제하시겠습니까?")) return;
        
        const params = new URLSearchParams();
        params.append('action', 'delete');
        params.append('index', index);

        try {
            await fetch(APP_SCRIPT_URL, {
                method: "POST",
                body: params
            });
            await loadNotices(); 
        } catch (e) {
            alert("삭제에 실패했습니다.");
            console.error(e);
        }
    }

    const schedule = [["인공", "운동", "전수", "고화학", "한국사"], ["인공", "영어1", "운동", "고화학", "미적2"], ["미적2", "고물리", "영어1", "고화학", "고지구"], ["한국사", "고물리", "독작", "한국사", "독작"], ["독작", "전수", "창체2", "미적2", "전수"], ["고생명", "고지구", "창체2", "인공", "영어1"], ["고생명", "고지구", "창체2", "고생명", "고물리"]];
    const tbody = document.getElementById('timetable-body');
    schedule.forEach((row, i) => {
        const tr = document.createElement('tr');
        let html = `<td>${i+1}</td>`;
        row.forEach((sub, idx) => { html += `<td class="${idx + 1 === currentDay ? 'today-col' : ''}">${sub}</td>`; });
        tr.innerHTML = html; tbody.appendChild(tr);
    });

    async function getMeal() {
        const hr = now.getHours(); let targetDate = new Date(now); let mealCode, mealLabel, dayStatus = "오늘";
        if (hr >= 19 || hr < 8) { mealCode = "1"; mealLabel = "조식"; if(hr >= 19) { targetDate.setDate(now.getDate() + 1); dayStatus = "내일"; } } 
        else if (hr >= 8 && hr < 13) { mealCode = "2"; mealLabel = "중식"; } else { mealCode = "3"; mealLabel = "석식"; }
        document.getElementById('meal-tag').innerText = `${dayStatus} ${mealLabel}`;
        const ymd = `${targetDate.getFullYear()}${String(targetDate.getMonth()+1).padStart(2,'0')}${String(targetDate.getDate()).padStart(2,'0')}`;
        try {
            const res = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=eb38b586f6af486b9fa46bf786d629d3&Type=json&ATPT_OFCDC_SC_CODE=N10&SD_SCHUL_CODE=8140071&MLSV_YMD=${ymd}`);
            const data = await res.json();
            if(data.mealServiceDietInfo) {
                const row = data.mealServiceDietInfo[1].row.find(r => r.MMEAL_SC_CODE === mealCode);
                document.getElementById('meal-content').innerText = row ? row.DDISH_NM.replace(/\([^)]*\)/g, "").replace(/<br\/>/g, ", ") : "급식 정보 없음";
            } else { document.getElementById('meal-content').innerText = "급식 없음"; }
        } catch (e) { document.getElementById('meal-content').innerText = "로딩 오류"; }
    }

    const afterSchoolDB = { "03-09": { sub: "생명과학", t: "임미정" }, "03-10": { sub: "물리", t: "박태수" }, "03-11": { sub: "물리", t: "박태수" }, "03-12": { sub: "수학1", t: "김솔이" }, "03-16": { sub: "화학", t: "윤자민" }, "03-17": { sub: "지구과학", t: "김미란" }, "03-18": { sub: "지구과학", t: "김미란" }, "03-19": { sub: "생명과학", t: "임미정" }, "03-23": { sub: "수학1", t: "김솔이" }, "03-24": { sub: "학력평가", t: "전국연합" }, "03-25": { sub: "수학2", t: "정종원" }, "03-26": { sub: "물리", t: "박태수" }, "03-30": { sub: "화학", t: "윤자민" }, "03-31": { sub: "지구과학", t: "김미란" }, "04-01": { sub: "물리", t: "박태수" }, "04-02": { sub: "생명과학", t: "임미정" }, "04-06": { sub: "수학1", t: "김솔이" }, "04-07": { sub: "수학2", t: "정종원" }, "04-08": { sub: "화학", t: "윤자민" }, "04-09": { sub: "생명과학", t: "임미정" } };
    function loadAfterSchool() {
        const key = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const target = document.getElementById('after-school-content');
        if (afterSchoolDB[key]) target.innerHTML = `<span class="after-name">${afterSchoolDB[key].sub}</span><span class="after-teacher" style="font-weight:700;">${afterSchoolDB[key].t} 선생님</span>`;
        else target.innerHTML = `<div style="color: var(--text-sub); font-size:1.1rem; font-weight:700;">예정된 방과후 없음</div>`;
    }

    window.onload = () => { loadNotices(); getMeal(); loadAfterSchool(); };
</script>
</body>
</html>
