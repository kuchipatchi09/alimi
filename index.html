<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2학년 2반 알리미</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <style>
        /* === 프리미엄 코퍼레이트 테마 변수 === */
        :root {
            /* 라이트 모드 (깨끗하고 신뢰감 있는 톤) */
            --bg: #f5f7f9;
            --surface: #ffffff;
            --text-primary: #111111;
            --text-secondary: #767676;
            --text-tertiary: #a1a1a1;
            --border: #e1e3e8;
            --accent: #0066cc; /* 대기업 특유의 신뢰감 있는 블루 */
            --accent-bg: #e5f0fa;
            --danger: #d93025;
            --danger-bg: #fce8e6;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 12px 24px rgba(0, 0, 0, 0.06);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        :root[data-theme="dark"] {
            /* 다크 모드 (세련되고 깊이감 있는 톤) */
            --bg: #000000;
            --surface: #151515;
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --text-tertiary: #555555;
            --border: #2d2d2d;
            --accent: #2997ff;
            --accent-bg: rgba(41, 151, 255, 0.15);
            --danger: #ff453a;
            --danger-bg: rgba(255, 69, 58, 0.15);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.4);
            --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-primary); 
            padding: 60px 20px; 
            line-height: 1.5; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* 헤더 영역 */
        header { width: 100%; max-width: 1100px; margin-bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 20px; border-bottom: 1px solid var(--border); transition: border-color 0.3s ease; }
        header h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.5px; }
        #header-date { color: var(--text-secondary); font-weight: 500; font-size: 1.1rem; }
        
        /* 그리드 레이아웃 (Bento 스타일) */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; width: 100%; max-width: 1100px; }
        
        /* 공통 카드 스타일 */
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow-sm); transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.3s ease, border-color 0.3s ease; }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .card-title { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }
        .badge { background: var(--accent-bg); color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }

        /* 공지사항 영역 (전체 너비) */
        .notice-section { grid-column: span 3; display: flex; flex-direction: column; gap: 16px; }
        .notice-input-wrapper { display: flex; gap: 12px; margin-bottom: 12px; }
        #notice-input { flex: 1; background: var(--surface); border: 1px solid var(--border); padding: 18px 24px; color: var(--text-primary); border-radius: var(--radius-md); font-size: 1.05rem; transition: border-color 0.2s ease, box-shadow 0.2s ease; box-shadow: var(--shadow-sm); }
        #notice-input::placeholder { color: var(--text-tertiary); }
        #notice-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
        .post-btn { background: var(--text-primary); color: var(--bg); border: none; padding: 0 32px; font-weight: 600; font-size: 1.05rem; border-radius: var(--radius-md); cursor: pointer; transition: opacity 0.2s ease; }
        .post-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .post-btn:hover:not(:disabled) { opacity: 0.8; }

        .notice-item { background: var(--surface); border: 1px solid var(--border); padding: 20px 24px; border-radius: var(--radius-md); display: flex; justify-content: space-between; align-items: center; transition: all 0.2s ease; }
        .notice-item:hover { border-color: var(--text-tertiary); }
        .notice-text { font-size: 1.05rem; font-weight: 500; color: var(--text-primary); flex: 1; display: flex; align-items: center; gap: 12px; }
        .notice-text::before { content: '공지'; background: var(--text-primary); color: var(--bg); font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
        .delete-btn { background: var(--danger-bg); color: var(--danger); border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; opacity: 0; transition: opacity 0.2s ease; }
        .notice-item:hover .delete-btn { opacity: 1; }
        .delete-btn:hover { background: var(--danger); color: #fff; }

        /* 시간표 영역 (2칸 차지) */
        .timetable-card { grid-column: span 2; grid-row: span 2; }
        .timetable { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 1rem; }
        .timetable th, .timetable td { padding: 16px 8px; text-align: center; border-bottom: 1px solid var(--border); transition: border-color 0.3s ease; }
        .timetable th { color: var(--text-secondary); font-weight: 600; font-size: 0.9rem; padding-bottom: 12px; }
        .timetable tr:last-child td { border-bottom: none; }
        .timetable td { font-weight: 500; color: var(--text-primary); }
        .today-col { background: var(--accent-bg); color: var(--accent) !important; font-weight: 700 !important; border-radius: 8px; }

        /* 급식 & 방과후 영역 (1칸씩 차지) */
        .side-card { display: flex; flex-direction: column; }
        .info-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        .meal-text { font-size: 1.15rem; font-weight: 500; color: var(--text-primary); line-height: 1.6; }
        .after-name { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px; margin-bottom: 4px; }
        .after-teacher { font-size: 1rem; color: var(--text-secondary); font-weight: 500; }

        /* 다크모드 플로팅 버튼 */
        .theme-toggle { position: fixed; bottom: 40px; right: 40px; width: 52px; height: 52px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer; display: flex; justify-content: center; align-items: center; z-index: 1000; transition: transform 0.2s ease; }
        .theme-toggle:hover { transform: scale(1.05); }
        .theme-toggle svg { width: 20px; height: 20px; fill: var(--text-primary); }

        /* 모바일 반응형 */
        @media (max-width: 900px) { 
            .dashboard { grid-template-columns: 1fr; } 
            .timetable-card { grid-column: span 1; grid-row: auto; }
            .notice-section { grid-column: span 1; }
            .notice-input-wrapper { flex-direction: column; }
            .post-btn { padding: 16px; }
            .delete-btn { opacity: 1; background: var(--danger); color: white; }
            body { padding: 30px 15px; }
            .theme-toggle { bottom: 20px; right: 20px; }
        }
    </style>
</head>
<body>

<header>
    <h1>2학년 2반 알리미</h1>
    <p id="header-date"></p>
</header>

<div class="dashboard">
    <div class="notice-section">
        <div class="notice-input-wrapper">
            <input type="text" id="notice-input" placeholder="새로운 공지사항을 입력하세요">
            <button class="post-btn" id="post-btn" onclick="postNotice()">등록</button>
        </div>
        <div id="notice-list-container">
            </div>
    </div>

    <div class="card timetable-card">
        <div class="card-header">
            <div class="card-title">주간 시간표</div>
            <div class="badge">이번 주</div>
        </div>
        <table class="timetable">
            <thead><tr><th>교시</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th></tr></thead>
            <tbody id="timetable-body"></tbody>
        </table>
    </div>

    <div class="card side-card">
        <div class="card-header">
            <div class="card-title">급식 메뉴</div>
            <div class="badge" id="meal-tag">로딩중</div>
        </div>
        <div class="info-content">
            <div id="meal-content" class="meal-text">데이터를 불러오는 중입니다.</div>
        </div>
    </div>

    <div class="card side-card">
        <div class="card-header">
            <div class="card-title">방과후 학교</div>
            <div class="badge">오늘</div>
        </div>
        <div class="info-content" id="after-school-content">
            </div>
    </div>
</div>

<button class="theme-toggle" id="theme-btn" onclick="toggleTheme()" aria-label="테마 변경"></button>

<script>
    // ⚠️ 앱스크립트 URL 입력
    const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydC8xGS66OKmKbiLzjmufMe0xXV_1Xj81OKXbLD_NNHtGL_6WSFhyLT7GMi1NKEFPRTg/exec";

    // 테마 설정 (시스템 동기화)
    const themeBtn = document.getElementById('theme-btn');
    const root = document.documentElement;
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
    const sunIcon = `<svg viewBox="0 0 24 24"><path d="M12 4.5a7.5 7.5 0 100 15 7.5 7.5 0 000-15zm0 13.5a6 6 0 110-12 6 6 0 010 12zm-1.125-14.625h2.25v2.25h-2.25zm0 17.25h2.25v2.25h-2.25zm9-9.375h2.25v2.25h-2.25zM1.5 11.25h2.25v2.25H1.5zm16.582-6.392l1.59-1.59 1.59 1.59-1.59 1.591zm-13.164 13.164l1.59-1.59 1.591 1.59-1.59 1.591zm14.754 0l-1.59-1.59-1.59 1.59 1.59 1.591zM4.918 4.858l-1.59-1.59-1.59 1.59 1.59 1.591z"/></svg>`;
    const moonIcon = `<svg viewBox="0 0 24 24"><path d="M21.56 16.142a9 9 0 01-13.7-13.7 9 9 0 1013.7 13.7z"/></svg>`;

    function initTheme() {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark' || (!savedTheme && prefersDark.matches)) {
            root.setAttribute('data-theme', 'dark'); themeBtn.innerHTML = sunIcon;
        } else {
            root.setAttribute('data-theme', 'light'); themeBtn.innerHTML = moonIcon;
        }
    }
    function toggleTheme() {
        const isDark = root.getAttribute('data-theme') === 'dark';
        root.setAttribute('data-theme', isDark ? 'light' : 'dark');
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
        themeBtn.innerHTML = isDark ? moonIcon : sunIcon;
    }
    prefersDark.addEventListener('change', (e) => {
        if (!localStorage.getItem('theme')) {
            root.setAttribute('data-theme', e.matches ? 'dark' : 'light');
            themeBtn.innerHTML = e.matches ? sunIcon : moonIcon;
        }
    });
    initTheme();

    // 날짜 설정
    const now = new Date();
    const currentDay = now.getDay();
    document.getElementById('header-date').innerText = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });

    // 공지사항 로딩
    async function loadNotices() {
        const container = document.getElementById('notice-list-container');
        try {
            const res = await fetch(APP_SCRIPT_URL);
            const data = await res.json();
            container.innerHTML = ""; 
            if (data.notices && data.notices.length > 0) {
                data.notices.forEach((text, index) => {
                    const div = document.createElement('div');
                    div.className = 'notice-item';
                    div.innerHTML = `<span class="notice-text">${text}</span><button class="delete-btn" onclick="deleteNotice(${index})">삭제</button>`;
                    container.appendChild(div);
                });
            }
        } catch (e) { console.error("공지 로딩 실패:", e); }
    }

    // 공지사항 등록
    async function postNotice() {
        const input = document.getElementById('notice-input');
        const btn = document.getElementById('post-btn');
        const text = input.value.trim();
        if(!text) return;

        btn.disabled = true; btn.innerText = "처리 중";
        const params = new URLSearchParams();
        params.append('action', 'add'); params.append('notice', text);

        try {
            await fetch(APP_SCRIPT_URL, { method: "POST", body: params });
            input.value = ''; await loadNotices(); 
        } catch (e) { alert("통신 오류가 발생했습니다."); } 
        finally { btn.disabled = false; btn.innerText = "등록"; }
    }

    // 공지사항 삭제
    async function deleteNotice(index) {
        if(!confirm("해당 공지를 삭제하시겠습니까?")) return;
        const params = new URLSearchParams();
        params.append('action', 'delete'); params.append('index', index);
        try {
            await fetch(APP_SCRIPT_URL, { method: "POST", body: params });
            await loadNotices(); 
        } catch (e) { alert("삭제 오류가 발생했습니다."); }
    }

    // 시간표
    const schedule = [["인공", "운동", "전수", "고화학", "한국사"], ["인공", "영어1", "운동", "고화학", "미적2"], ["미적2", "고물리", "영어1", "고화학", "고지구"], ["한국사", "고물리", "독작", "한국사", "독작"], ["독작", "전수", "창체2", "미적2", "전수"], ["고생명", "고지구", "창체2", "인공", "영어1"], ["고생명", "고지구", "창체2", "고생명", "고물리"]];
    const tbody = document.getElementById('timetable-body');
    schedule.forEach((row, i) => {
        const tr = document.createElement('tr');
        let html = `<td>${i+1}</td>`;
        row.forEach((sub, idx) => { html += `<td class="${idx + 1 === currentDay ? 'today-col' : ''}">${sub}</td>`; });
        tr.innerHTML = html; tbody.appendChild(tr);
    });

    // 급식
    async function getMeal() {
        const hr = now.getHours(); let targetDate = new Date(now); let mealCode, mealLabel, dayStatus = "오늘";
        if (hr >= 19 || hr < 8) { mealCode = "1"; mealLabel = "조식"; if(hr >= 19) { targetDate.setDate(now.getDate() + 1); dayStatus = "내일"; } } 
        else if (hr >= 8 && hr < 13) { mealCode = "2"; mealLabel = "중식"; } else { mealCode = "3"; mealLabel = "석식"; }
        document.getElementById('meal-tag').innerText = `${dayStatus} ${mealLabel}`;
        const ymd = `${targetDate.getFullYear()}${String(targetDate.getMonth()+1).padStart(2,'0')}${String(targetDate.getDate()).padStart(2,'0')}`;
        try {
            const res = await fetch(`https://open.neis.go.kr/hub/mealServiceDietInfo?KEY=eb38b586f6af486b9fa46bf786d629d3&Type=json&ATPT_OFCDC_SC_CODE=N10&SD_SCHUL_CODE=8140071&MLSV_YMD=${ymd}`);
            const data = await res.json();
            if(data.mealServiceDietInfo) {
                const row = data.mealServiceDietInfo[1].row.find(r => r.MMEAL_SC_CODE === mealCode);
                document.getElementById('meal-content').innerText = row ? row.DDISH_NM.replace(/\([^)]*\)/g, "").replace(/<br\/>/g, ", ") : "예정된 급식이 없습니다.";
            } else { document.getElementById('meal-content').innerText = "예정된 급식이 없습니다."; }
        } catch (e) { document.getElementById('meal-content').innerText = "정보를 불러올 수 없습니다."; }
    }

    // 방과후
    const afterSchoolDB = { "03-09": { sub: "생명과학", t: "임미정" }, "03-10": { sub: "물리", t: "박태수" }, "03-11": { sub: "물리", t: "박태수" }, "03-12": { sub: "수학1", t: "김솔이" }, "03-16": { sub: "화학", t: "윤자민" }, "03-17": { sub: "지구과학", t: "김미란" }, "03-18": { sub: "지구과학", t: "김미란" }, "03-19": { sub: "생명과학", t: "임미정" }, "03-23": { sub: "수학1", t: "김솔이" }, "03-24": { sub: "학력평가", t: "전국연합" }, "03-25": { sub: "수학2", t: "정종원" }, "03-26": { sub: "물리", t: "박태수" }, "03-30": { sub: "화학", t: "윤자민" }, "03-31": { sub: "지구과학", t: "김미란" }, "04-01": { sub: "물리", t: "박태수" }, "04-02": { sub: "생명과학", t: "임미정" }, "04-06": { sub: "수학1", t: "김솔이" }, "04-07": { sub: "수학2", t: "정종원" }, "04-08": { sub: "화학", t: "윤자민" }, "04-09": { sub: "생명과학", t: "임미정" } };
    function loadAfterSchool() {
        const key = `${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const target = document.getElementById('after-school-content');
        if (afterSchoolDB[key]) {
            target.innerHTML = `<div class="after-name">${afterSchoolDB[key].sub}</div><div class="after-teacher">${afterSchoolDB[key].t} 선생님</div>`;
        } else {
            target.innerHTML = `<div style="color: var(--text-tertiary); font-size: 1.05rem; font-weight: 500;">예정된 일정이 없습니다.</div>`;
        }
    }

    window.onload = () => { loadNotices(); getMeal(); loadAfterSchool(); };
</script>
</body>
</html>
